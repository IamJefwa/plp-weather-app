<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Weather Dashboard</h1>
            <p class="tagline">PLP Web Development Bootcamp</p>
        </header>

        <div class="search-container">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
            <div class="unit-toggle">
                <button id="celsius" class="active">°C</button>
                <button id="fahrenheit">°F</button>
            </div>
        </div>

        <div class="weather-container hide">
            <div class="location-info">
                <h2 id="city-name"></h2>
                <p id="date-time"></p>
            </div>

            <div class="weather-info">
                <div class="weather-icon">
                    <img id="weather-icon" src="" alt="Weather icon">
                    <p id="weather-description"></p>
                </div>
                
                <div class="temp-container">
                    <h2 id="temperature"></h2>
                    <p id="feels-like"></p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail">
                    <i class="fas fa-tint"></i>
                    <div>
                        <p>Humidity</p>
                        <p id="humidity"></p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-wind"></i>
                    <div>
                        <p>Wind Speed</p>
                        <p id="wind-speed"></p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-compress-arrows-alt"></i>
                    <div>
                        <p>Pressure</p>
                        <p id="pressure"></p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-eye"></i>
                    <div>
                        <p>Visibility</p>
                        <p id="visibility"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="loading hide">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <div class="error-container hide">
            <i class="fas fa-exclamation-circle"></i>
            <p id="error-message">City not found. Please try again.</p>
        </div>

        <footer>
            <p>Created for PLP Web Development Bootcamp &copy; 2025</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
